<svg xmlns="http://www.w3.org/2000/svg" width="840" height="324" viewBox="0 0 840 324" role="img" aria-labelledby="title desc">
<title id="title">Sebaran tahun pengucapan — 50 putusan</title>
<desc id="desc">2023: 17 putusan atau 34 persen. 2024: 15 putusan atau 30 persen. 2025: 18 putusan atau 36 persen. Panjang segmen sebanding dengan jumlah putusan.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#21121e"/><stop offset="1" stop-color="#11151f"/></linearGradient><clipPath id="bar"><rect x="36" y="102" width="768" height="22" rx="11"/></clipPath></defs>
<rect x="1" y="1" width="838" height="322" rx="20" fill="url(#bg)" stroke="#4c3545" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="36" y="51" fill="#fff4f7" font-size="28" font-weight="700">Sebaran tahun pengucapan</text>
<text x="804" y="51" text-anchor="end" fill="#d3c6d0" font-size="23">50 putusan</text>
<g clip-path="url(#bar)"><rect x="36" y="102" width="261.12" height="22" fill="#ff4167"/><rect x="297.12" y="102" width="230.4" height="22" fill="#ff93a6"/><rect x="527.52" y="102" width="276.48" height="22" fill="#c5b5ff"/></g>
<path d="M274 161v126M530 161v126" stroke="#493443"/>
<circle cx="41" cy="174" r="5" fill="#ff4167"/><text x="58" y="183" fill="#ff4167" font-size="28" font-weight="600">2023</text>
<text x="36" y="242" fill="#fff4f7" font-size="48" font-weight="700">17</text><text x="103" y="241" fill="#d3c6d0" font-size="23">putusan</text>
<text x="36" y="281" fill="#d3c6d0" font-size="23">34% dari koleksi</text>
<circle cx="297" cy="174" r="5" fill="#ff93a6"/><text x="314" y="183" fill="#ff93a6" font-size="28" font-weight="600">2024</text>
<text x="292" y="242" fill="#fff4f7" font-size="48" font-weight="700">15</text><text x="359" y="241" fill="#d3c6d0" font-size="23">putusan</text>
<text x="292" y="281" fill="#d3c6d0" font-size="23">30% dari koleksi</text>
<circle cx="553" cy="174" r="5" fill="#c5b5ff"/><text x="570" y="183" fill="#c5b5ff" font-size="28" font-weight="600">2025</text>
<text x="548" y="242" fill="#fff4f7" font-size="48" font-weight="700">18</text><text x="615" y="241" fill="#d3c6d0" font-size="23">putusan</text>
<text x="548" y="281" fill="#d3c6d0" font-size="23">36% dari koleksi</text>
</g></svg>
